<footer class="site-footer">
    <div class="site-footer-inner">
        {% include sns-links.html center=true %}
        <p class="copyright">&copy; {{ site.time | date: '%Y' }} {{ site.title }}<span class="footer-credit">基于 <a href="https://jekyllrb.com/">Jekyll</a></span></p>
    </div>
</footer>

<script src="{{ '/assets/dist/site.min.js' | prepend: site.baseurl }}" defer></script>

{% if page.url contains '/archive' %}
<script src="{{ '/assets/dist/archive.min.js' | prepend: site.baseurl }}" defer></script>
{% endif %}

{% if site.service-worker %}
<script src="{{ '/assets/dist/snackbar.min.js' | prepend: site.baseurl }}" defer></script>
<script src="{{ '/assets/dist/sw-registration.min.js' | prepend: site.baseurl }}" defer></script>
{% endif %}

{% if site.ga_track_id %}
<script>
    (function (i, s, o, g, r, a, m) {
        i.GoogleAnalyticsObject = r;
        i[r] = i[r] || function () { (i[r].q = i[r].q || []).push(arguments); };
        i[r].l = 1 * new Date();
        a = s.createElement(o);
        m = s.getElementsByTagName(o)[0];
        a.async = 1;
        a.src = g;
        m.parentNode.insertBefore(a, m);
    }(window, document, 'script', 'https://www.google-analytics.com/analytics.js', 'ga'));
    ga('create', {{ site.ga_track_id | jsonify }}, {{ site.ga_domain | jsonify }});
    ga('send', 'pageview');
</script>
{% endif %}

{% if site.ba_track_id %}
<script>
    var _hmt = _hmt || [];
    (function () {
        var hm = document.createElement('script');
        hm.src = 'https://hm.baidu.com/hm.js?' + {{ site.ba_track_id | jsonify }};
        var firstScript = document.getElementsByTagName('script')[0];
        firstScript.parentNode.insertBefore(hm, firstScript);
    }());
</script>
{% endif %}
