<dialog class="search-dialog" id="site-search" aria-labelledby="search-title" data-search-index="{{ '/search.json' | prepend: site.baseurl }}">
    <div class="search-dialog-header">
        <h2 id="search-title">搜索文章</h2>
        <button class="search-close" type="button" aria-label="关闭搜索">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
        </button>
    </div>
    <form class="search-form" role="search">
        <label for="search-input">输入标题、副标题或标签</label>
        <input type="search" id="search-input" name="q" placeholder="试试 Java、架构、学习……" autocomplete="off" aria-describedby="search-status" autofocus>
    </form>
    <p class="search-status" id="search-status" role="status" aria-live="polite" aria-atomic="true">输入关键词，找一篇想读的文章。</p>
    <div id="search-results" class="search-results"></div>
</dialog>
