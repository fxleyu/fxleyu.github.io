{% assign archive_page = site.pages | where: 'name', 'archive.html' | first %}
{% assign about_page = site.pages | where: 'name', 'about.md' | first %}
<nav class="site-nav" aria-label="主导航">
    <div class="site-nav-inner">
        <a class="site-brand" href="{{ site.baseurl }}/" aria-label="{{ site.title }} 首页">{{ site.title }}</a>
        <button class="site-nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav-links">
            <span>菜单</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <ul class="site-nav-links" id="site-nav-links">
            <li><a href="{{ site.baseurl }}/"{% if page.name == 'index.html' or page.layout == 'post' %} aria-current="page"{% endif %}>文章</a></li>
            <li><a href="{{ archive_page.url | prepend: site.baseurl }}"{% if page.url == archive_page.url %} aria-current="page"{% endif %}>归档</a></li>
            <li><a href="{{ about_page.url | prepend: site.baseurl }}"{% if page.url == about_page.url %} aria-current="page"{% elsif page.url == '/self-portrayal/' %} aria-current="location"{% endif %}>关于</a></li>
            <li>
                <button class="site-search-open" type="button" aria-haspopup="dialog" aria-controls="site-search">
                    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
                    <span>搜索</span>
                </button>
            </li>
        </ul>
    </div>
</nav>
