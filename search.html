<section class="reading-layout search-page" id="site-search" aria-labelledby="search-title" data-search-index="{{ '/search.json' | prepend: site.baseurl }}">
    <header class="page-heading">
        <p class="eyebrow">SEARCH</p>
        <h1 id="search-title">搜索文章</h1>
        <p>从标题、副标题或标签中，找一篇想读的文章。</p>
    </header>
    <form class="search-form" role="search" action="{{ site.baseurl }}/search/" method="get">
        <label for="search-input">关键词</label>
        <div class="search-field">
            <input type="search" id="search-input" name="q" placeholder="试试 Java、架构、学习……" autocomplete="off" enterkeyhint="search" aria-describedby="search-status">
            <button class="search-submit" type="submit">搜索</button>
        </div>
    </form>
    <p class="search-status" id="search-status" role="status" aria-live="polite" aria-atomic="true">输入关键词，找一篇想读的文章。</p>
    <div id="search-results" class="search-results"></div>
    <noscript><p>搜索需要启用 JavaScript，也可以前往<a class="back-link" href="{{ site.baseurl }}/archive/">文章归档</a>查找。</p></noscript>
</section>
