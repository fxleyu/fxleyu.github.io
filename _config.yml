# Site settings
title: FXLEYU
SEOTitle: 风雪乐雨的博客 | fxleyu Blog
email: fxleyu@qq.com
description: "I walk slowly, like one who comes from so far away he doesn’t expect to arrive. ——Jorge Luis Borges"
keyword: "fxleyu, 风雪乐雨, 博客, 个人网站, Java, 后端, 分布式, 微服务, DDD"
url: "https://fxleyu.github.io"              # your host, for absolute URL
baseurl: ""                             # for example, '/blog' if your blog hosted on 'host/blog'

# Publish posts or collection documents with a future date.
future: true

# SNS settings
RSS: false
weibo_username:     fxleyu
zhihu_username:     fxleyu
github_username:    fxleyu
twitter_username:   fxleyu
facebook_username:  fxleyu
#linkedin_username:  fxleyu

# Build settings
highlighter: rouge
permalink: pretty
paginate: 30      # 分页设置
exclude:
  - node_modules
  - vendor
  - scripts
  - docs
  # Post bundle folders contain dates; keep source images out of Jekyll's post matcher.
  - _posts/**/images/**
  - assets/css
  - assets/js
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - README.md
  - NOTICE
  - LICENSE
heading_anchors: true
comments:
  enabled: true
  repository: fxleyu/fxleyu.github.io
  issue_term: pathname
# Preserve historical publication dates and URLs.
timezone: CN  

# Jekyll plugins
plugins: [jekyll-paginate]

# Markdown settings
markdown: kramdown
kramdown:
  input: GFM # use Github Flavored Markdown !important
  syntax_highlighter_opts:
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

# Analytics settings
# Baidu Analytics
# ba_track_id: [your track id]

# Google Analytics
#ga_track_id: 'UA-49627206-1'            # Format: UA-xxxxxx-xx
#ga_domain: fxleyu.github.io

# Sidebar settings
sidebar: true                           # whether or not using Sidebar.
sidebar-about-description: "Coder, Reader & Writer"
sidebar-avatar: /img/avatar_fxleyu.png      # use absolute URL, seeing it's used in both `/` and `/about/`

# Featured Tags
featured-tags: true                     # whether or not using Feature-Tags
featured-condition-size: 1              # A tag will be featured if the size of it is more than this condition value

# Progressive Web Apps
chrome-tab-theme-color: "#ffffff"
service-worker: true
